name: Compilar JARVIS APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar proyecto
        run: |
          mkdir -p proyecto

          if [ -f "jarvis-completo-final.zip" ]; then
            echo "Usando jarvis-completo-final.zip"
            unzip -q "jarvis-completo-final.zip" -d proyecto
          else
            echo "ERROR: No se encontró jarvis-completo-final.zip"
            echo "Archivos disponibles:"
            ls -la
            exit 1
          fi

          echo "Proyecto preparado correctamente."
          echo "Contenido:"
          find proyecto -maxdepth 3 -type f | head -100

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 34
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        working-directory: proyecto
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: proyecto/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
