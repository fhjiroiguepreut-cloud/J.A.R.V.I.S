name: Construir APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Buscar proyecto Android
        shell: bash
        run: |
          set -e

          echo "Buscando gradlew..."

          if [ -f "./gradlew" ]; then
            PROJECT_DIR="."
          elif [ -f "./proyecto/gradlew" ]; then
            PROJECT_DIR="./proyecto"
          else
            PROJECT_DIR="$(find . -name gradlew -type f -not -path '*/.git/*' | head -n 1 | xargs -r dirname)"

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: No se encontró gradlew."
              find . -maxdepth 4 -type f | sort | head -200
              exit 1
            fi
          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo "Proyecto encontrado en:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Dar permisos a Gradle
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew no existe en $PROJECT_DIR"
            ls -la
            exit 1
          fi

          chmod +x ./gradlew
          ls -la ./gradlew

      - name: Verificar proyecto
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          echo "Archivos del proyecto:"
          ls -la

          echo "Estructura:"
          find . -maxdepth 3 -type f \
            \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "gradle.properties" -o -name "settings.gradle*" \) \
            -print

      - name: Compilar APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          ./gradlew clean assembleDebug \
            --stacktrace \
            --no-daemon \
            --console=plain

      - name: Buscar APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          echo "APKs encontrados:"
          find . -type f -name "*.apk" -print

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
